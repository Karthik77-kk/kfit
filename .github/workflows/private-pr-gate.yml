name: Private PR Quality Gate

# Runs kfit-app's PR quality gate HERE, in the public repo, and reports the
# result back to the private PR.
#
# Why: GitHub bills private-repo Actions minutes against the account quota and
# gives public-repo standard runners away free. On 2026-08-14 the account hit
# 3,000/3,000 and every kfit-app workflow began failing *before starting* — no
# steps, no logs, because GitHub would not allocate a runner at all. That blocks
# every merge, because branch protection requires checks that can no longer run.
#
# The private source is NEVER mirrored here. It is checked out onto the runner's
# temporary workspace with a read-only token and disappears with the runner.
#
# ── Why this POLLS instead of being triggered ───────────────────────────────
# The obvious design is: private repo sends a repository_dispatch, public repo
# runs CI. That cannot work, and the reason is worth stating so nobody rebuilds
# it that way. Sending a dispatch needs a workflow run IN THE PRIVATE REPO,
# which needs Actions minutes, and there are none. The trigger is circular at
# exactly the moment it is needed.
#
# So the public repo polls: it asks the private repo which PRs are open and
# which head commits have no result yet. That needs zero private minutes, and
# it is computed from real state rather than from a trigger someone has to keep
# wired up correctly (see Rule 23).
#
# repository_dispatch is kept as a fast path for when the quota resets and the
# private side can afford a one-line dispatch job again.

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and drifts under load,
    # so this is a floor on latency, not a promise.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to gate (blank = every open PR that needs it)"
        required: false
  repository_dispatch:
    types: [private-pr-quality]

concurrency:
  # NOT cancel-in-progress. Runs pick up different PRs, so cancelling a running
  # one loses that PR's result and it waits another full cycle.
  group: private-pr-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIVATE_REPO: Karthik77-kk/kfit-app
  # Must match the required status check on kfit-app/main EXACTLY. Branch
  # protection matches by context string; a typo here produces a green status
  # nobody is waiting for while the PR blocks forever on the real one.
  CONTEXT: Verify (analyze + test)
  COVERAGE_MIN: "80"

jobs:
  discover:
    name: Find PRs needing a gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - name: Ask the private repo what needs running
        id: find
        env:
          # Fine-grained PAT scoped to kfit-app ONLY:
          #   Contents: read           (check out the source)
          #   Pull requests: read      (list open PRs)
          #   Commit statuses: write   (report the result back)
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::KFIT_APP_TOKEN is not set. Create a fine-grained PAT"
            echo "scoped to ${PRIVATE_REPO} with Contents:read, Pull requests:read,"
            echo "Commit statuses:write and add it as a secret on this repo."
            exit 1
          fi

          ONLY="${{ github.event.inputs.pr || github.event.client_payload.pr || '' }}"

          PRS=$(gh pr list --repo "$PRIVATE_REPO" --state open --base main \
                  --json number,headRefOid,baseRefOid,headRefName,title,isDraft --limit 50)

          SELECTED='[]'
          for row in $(echo "$PRS" | jq -r '.[] | @base64'); do
            pr() { echo "$row" | base64 -d | jq -r "$1"; }
            NUM=$(pr .number); SHA=$(pr .headRefOid); BASE=$(pr .baseRefOid); REF=$(pr .headRefName)
            [ "$(pr .isDraft)" = "true" ] && continue
            if [ -n "$ONLY" ] && [ "$NUM" != "$ONLY" ]; then continue; fi

            # Skip head commits that already carry a verdict. Without this the
            # poll re-runs the whole suite for every open PR every 10 minutes,
            # which would burn the public repo's goodwill and swamp the queue.
            # An explicit workflow_dispatch for one PR overrides that, which is
            # how you force a re-run.
            if [ -z "$ONLY" ]; then
              STATE=$(gh api "repos/$PRIVATE_REPO/commits/$SHA/status" \
                        --jq --arg c "$CONTEXT" \
                        '[.statuses[] | select(.context == $c)] | first | .state // "none"' \
                        2>/dev/null || echo none)
              case "$STATE" in success|failure|error|pending) continue ;; esac
            fi

            SELECTED=$(echo "$SELECTED" | jq -c \
              --argjson n "$NUM" --arg s "$SHA" --arg b "$BASE" --arg r "$REF" \
              '. + [{pr:$n, sha:$s, base:$b, ref:$r}]')
          done

          COUNT=$(echo "$SELECTED" | jq 'length')
          echo "Selected $COUNT PR(s): $SELECTED"
          echo "matrix=$(echo "$SELECTED" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify PR
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # One PR at a time. These are free minutes but not infinite runners, and
      # a serial queue keeps the log readable when several PRs land together.
      max-parallel: 2
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Mark the PR as running
        env:
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
        run: |
          gh api -X POST "repos/$PRIVATE_REPO/statuses/${{ matrix.sha }}" \
            -f state=pending \
            -f context="$CONTEXT" \
            -f description="Running on the public runner" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out the private source
        uses: actions/checkout@v7
        with:
          repository: Karthik77-kk/kfit-app
          ref: ${{ matrix.sha }}
          token: ${{ secrets.KFIT_APP_TOKEN }}
          fetch-depth: 0
          # The token must not survive into the workspace git config: any step
          # after this runs code from the PR, and this token can read the whole
          # private repo.
          persist-credentials: false

      - name: Detect changed paths
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ matrix.base }}" "${{ matrix.sha }}")
          # Deliberately NOT echoed. Logs on a public repo are world-readable,
          # and a file list is a map of a private codebase.
          if echo "$FILES" | grep -qE '(\.dart$|^pubspec\.yaml$)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '(^android/|\.kt$|\.gradle|\.xml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files: $(echo "$FILES" | wc -l)"

      - name: Secret scan (no hardcoded credentials in lib/, test/, or workflows)
        run: |
          # HF tokens, GitHub PATs, AWS keys, Google/Gemini API keys, private keys.
          # Covers lib/ + test/ (Dart source/tests) AND .github/ (CI workflows) —
          # the 2026-07-04 incident (a full Android signing keystore + its
          # plaintext password committed directly in build_apk.yml) would NOT have
          # been caught by a lib/-only scan, since it lived in a workflow file.
          PATTERN='hf_[A-Za-z0-9]{30}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # Lines tagged `gate-allow-token` are intentional, allowlisted bundled
          # credentials (e.g. the gated HF model-download token) — any OTHER match fails.
          if grep -rEn "$PATTERN" lib/ test/ .github/ | grep -v 'gate-allow-token'; then
            echo "::error::Hardcoded credential detected. Move it to a GitHub Actions secret, or tag the line // gate-allow-token if it is an intentional bundled token."
            exit 1
          fi
          echo "✅ No unexpected hardcoded credentials in lib/, test/, or .github/"

      - name: Keystore regression guard (no signing material committed)
        run: |
          # Regression guard for the exact 2026-07-04 incident: a base64 PKCS12
          # keystore blob and its plaintext password/alias were hardcoded directly
          # in build_apk.yml. Both now come from ANDROID_KEYSTORE_BASE64 /
          # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets — this fails the
          # build if either pattern ever reappears in committed source.
          if git ls-files | grep -qE '\.(jks|keystore|p12|pfx)$'; then
            echo "::error::A keystore file (*.jks/*.keystore/*.p12/*.pfx) is tracked in git. Signing keys must never be committed — use ANDROID_KEYSTORE_BASE64 instead."
            exit 1
          fi
          if grep -rEn '"MII[A-Za-z0-9+/=]{100,}' .github/ 2>/dev/null; then
            echo "::error::A base64 blob matching a PKCS12/DER keystore preamble (MII...) is hardcoded in a workflow file. Keystores must only be injected via the ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          if grep -rEn '(storePassword|keyPassword)=[A-Za-z0-9]' .github/ 2>/dev/null | grep -vE '\$\{\{ secrets\.|\$ANDROID_'; then
            echo "::error::A literal (non-secret) storePassword/keyPassword value is hardcoded in a workflow file. Use \${{ secrets.ANDROID_KEYSTORE_PASSWORD }} instead."
            exit 1
          fi
          echo "✅ No signing material committed"

      - name: App identity guard (applicationId + namespace pinned)
        run: |
          F=.github/workflows/build_apk.yml
          grep -q 'applicationId "com.example.karthik_fitness"' "$F" || { echo "::error::applicationId must stay com.example.karthik_fitness (changing it orphans every install)."; exit 1; }
          grep -q 'namespace "com.example.karthik_fitness"' "$F"     || { echo "::error::namespace must stay com.example.karthik_fitness (must match committed .kt package)."; exit 1; }
          echo "✅ App identity pinned"

      - name: Author identity guard (no AI attribution)
        run: |
          # Rule 18: Karthik is the sole author and contributor. GitHub reads
          # Co-Authored-By trailers and lists whoever they name in the repo's
          # Contributors graph — which is public-facing on kfit, and is why the
          # public repo's history had to be squashed once already.
          #
          # Nothing enforced this before. The rule was written down, and the
          # only thing standing between it and main was remembering it; the
          # documentation asserted a guard that did not exist in any workflow.
          #
          # Scoped to the PR's OWN commits (base..head), never the whole
          # history. kfit-app carries ~190 older commits with these trailers —
          # known, accepted, and deliberately left alone — so a history-wide
          # scan would fail every PR forever and be switched off within a day.
          RANGE="${{ matrix.base }}..${{ matrix.sha }}"

          if git log --format='%B' "$RANGE" \
               | grep -inE '^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|openai|gpt-|gemini)'; then
            echo "::error::A commit in this PR credits an AI as co-author. GitHub counts that as a real repository contributor. Remove the trailer (git rebase -i, or git commit --amend) and force-push."
            exit 1
          fi

          # The author/committer lines themselves, for the same reason. Bots
          # that legitimately open PRs (Dependabot) are not matched: this looks
          # for AI assistant identities, not for automation in general.
          if git log --format='%an <%ae>%n%cn <%ce>' "$RANGE" \
               | grep -inE '(claude|anthropic|copilot|openai)'; then
            echo "::error::A commit in this PR is authored or committed by an AI identity. Re-author it as Karthik and force-push."
            exit 1
          fi
          echo "✅ No AI attribution in this PR's commits"

      - name: Set up Java
        if: steps.changed.outputs.code == 'true' || steps.changed.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.changed.outputs.code == 'true' || steps.changed.outputs.android == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache pub packages
        if: steps.changed.outputs.code == 'true' || steps.changed.outputs.android == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        if: steps.changed.outputs.code == 'true' || steps.changed.outputs.android == 'true'
        run: flutter pub get

      - name: Compile Android (Kotlin + Resources)
        if: steps.changed.outputs.android == 'true'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Analyze, test, and self-healing repair
        if: steps.changed.outputs.code == 'true'
        env:
          HEAD_REF: ${{ matrix.ref }}
          PR_NUM: ${{ matrix.pr }}
          BASE_SHA: ${{ matrix.base }}
          GEMINI_API_KEY_LOGS: ${{ secrets.GEMINI_API_KEY_LOGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_LOGS || secrets.GEMINI_API_KEY }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PRIVATE_REPO: ${{ env.PRIVATE_REPO }}
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
        run: |
          set -eo pipefail

          HEAD_REF="${HEAD_REF:-}"
          MAX_REPAIRS=3
          ATTEMPT=0

          while true; do
            echo "============================================================"
            echo "▶ Validation pass (Attempt $ATTEMPT of $MAX_REPAIRS) on $HEAD_REF"
            echo "============================================================"

            FAILURE_STAGE=""
            mkdir -p /tmp/ci_errors
            LOG_FILE="/tmp/ci_errors/failure.log"
            rm -f "$LOG_FILE"

            echo "Running flutter analyze..."
            if ! flutter analyze --no-fatal-infos > "$LOG_FILE" 2>&1; then
              FAILURE_STAGE="flutter analyze"
              cat "$LOG_FILE"
            fi

            if [ -z "$FAILURE_STAGE" ]; then
              # Look for a targeted unit test matching any modified lib file
              TARGET_TEST=""
              CHANGED_DART=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -E '^lib/.*\.dart$' | head -n1 || echo "")
              if [ -n "$CHANGED_DART" ]; then
                BASE_NAME=$(basename "$CHANGED_DART" .dart)
                CANDIDATE_1=$(echo "$CHANGED_DART" | sed 's|^lib/|test/|; s|\.dart$|_test.dart|')
                CANDIDATE_2="test/${BASE_NAME}_test.dart"
                if [ -f "$CANDIDATE_1" ]; then
                  TARGET_TEST="$CANDIDATE_1"
                elif [ -f "$CANDIDATE_2" ]; then
                  TARGET_TEST="$CANDIDATE_2"
                else
                  FOUND=$(find test -name "${BASE_NAME}_test.dart" 2>/dev/null | head -n1 || echo "")
                  if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
                    TARGET_TEST="$FOUND"
                  fi
                fi
              fi

              if [ -n "$TARGET_TEST" ]; then
                echo "🎯 Running fast targeted component test first: $TARGET_TEST..."
                if ! flutter test "$TARGET_TEST" > "$LOG_FILE" 2>&1; then
                  FAILURE_STAGE="targeted test ($TARGET_TEST)"
                  cat "$LOG_FILE"
                else
                  echo "✅ Fast targeted component test passed ($TARGET_TEST)"
                fi
              fi
            fi

            if [ -z "$FAILURE_STAGE" ]; then
              echo "Running flutter test --coverage..."
              if ! flutter test --coverage > "$LOG_FILE" 2>&1; then
                FAILURE_STAGE="flutter test"
                cat "$LOG_FILE"
              fi
            fi

            if [ -z "$FAILURE_STAGE" ]; then
              echo "Evaluating line coverage..."
              if [ ! -f coverage/lcov.info ]; then
                FAILURE_STAGE="coverage/lcov.info missing"
                echo "$FAILURE_STAGE" > "$LOG_FILE"
              else
                awk '/^SF:/ { skip = ($0 ~ /\.g\.dart$/) } !skip' coverage/lcov.info > coverage/lcov.measured
                PCT=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if(lf>0) printf "%.1f", lh/lf*100; else print "0" }' coverage/lcov.measured)
                echo "Line coverage: ${PCT}% (floor ${COVERAGE_MIN}%)"
                if awk "BEGIN{exit !($PCT < $COVERAGE_MIN)}"; then
                  FAILURE_STAGE="Coverage floor failed (${PCT}% < ${COVERAGE_MIN}%)"
                  echo "Line coverage is ${PCT}%, which is below the required floor of ${COVERAGE_MIN}%." > "$LOG_FILE"
                fi
              fi
            fi

            # If all checks passed, validation succeeded
            if [ -z "$FAILURE_STAGE" ]; then
              echo "✅ All checks passed successfully!"
              break
            fi

            # If not an ai-fix branch or max repairs reached, fail the step
            if [[ "$HEAD_REF" != ai-fix/* ]] || [ "$ATTEMPT" -ge "$MAX_REPAIRS" ]; then
              echo "::error::Validation failed at $FAILURE_STAGE."
              if [[ "$HEAD_REF" == ai-fix/* ]] && [ -n "$PUSH_TOKEN" ]; then
                echo "Auto-repair exhausted ($MAX_REPAIRS attempts). Auto-closing failed AI fix PR to unblock queue."
                GH_TOKEN="$PUSH_TOKEN" gh pr close "$PR_NUM" --repo "$PRIVATE_REPO" --comment "Auto-closing AI fix PR: automated checks ($FAILURE_STAGE) failed after $MAX_REPAIRS repair attempts." || true
              fi
              exit 1
            fi

            # Perform AI repair
            ATTEMPT=$((ATTEMPT + 1))
            echo "🔧 Attempting in-flow AI repair (Attempt $ATTEMPT of $MAX_REPAIRS) for $FAILURE_STAGE..."

            API_KEY="${GEMINI_API_KEY_LOGS:-$GEMINI_API_KEY}"
            if [ -z "$API_KEY" ]; then
              echo "::error::No GEMINI_API_KEY available for repair."
              exit 1
            fi

            TARGET_DART=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -E '^lib/.*\.dart$' | head -n1 || echo "")
            if ! GEMINI_API_KEY_LOGS="$API_KEY" node tools/telemetry/repair_patch.js --error-file "$LOG_FILE" --repo-dir . --target "$TARGET_DART"; then
              echo "::error::repair_patch.js was unable to synthesize a valid repair."
              if [ -n "$PUSH_TOKEN" ]; then
                GH_TOKEN="$PUSH_TOKEN" gh pr close "$PR_NUM" --repo "$PRIVATE_REPO" --comment "Auto-closing AI fix PR: automated repair engine could not synthesize a valid fix for $FAILURE_STAGE." || true
              fi
              exit 1
            fi

            git config user.name "Karthik M"
            git config user.email "iammrkarthik2002@gmail.com"
            git add lib/ test/
            if git diff --staged --quiet; then
              echo "::error::Repaired code produced no git changes."
              exit 1
            fi

            git commit -m "fix(telemetry): auto-repair $FAILURE_STAGE failure"
            if [ -n "$PUSH_TOKEN" ]; then
              git push "https://x-access-token:${PUSH_TOKEN}@github.com/${PRIVATE_REPO}.git" "HEAD:${HEAD_REF}"
              echo "Pushed repaired commit to ${HEAD_REF}. Retesting immediately in this runner..."
            else
              echo "::error::PUSH_TOKEN not available to push repair."
              exit 1
            fi
          done

      - name: Docs-only PR
        if: steps.changed.outputs.code == 'false'
        run: echo "No Dart/pubspec changes — analyze/test skipped; guards still ran."

      # always(), so a failed or cancelled run still reports. Without this a
      # crash leaves the PR stuck on "pending" forever with nothing coming.
      - name: Report the verdict back to the private PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) STATE=success; DESC="Passed on the public runner" ;;
            cancelled) STATE=error;  DESC="Cancelled" ;;
            *) STATE=failure; DESC="Failed — see the run log" ;;
          esac
          TARGET_SHA=$(git rev-parse HEAD 2>/dev/null || echo "${{ matrix.sha }}")
          gh api -X POST "repos/$PRIVATE_REPO/statuses/$TARGET_SHA" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify owner and record gate verification for AI fix PR
        if: always() && job.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          BACKUP_REPO: Karthik77-kk/kfit-backups
          PR_NUM: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          HEAD_REF="${{ matrix.ref }}"
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(gh api "repos/$PRIVATE_REPO/pulls/$PR_NUM" --jq .head.ref 2>/dev/null || echo "")
          fi
          if [[ "$HEAD_REF" != ai-fix/* ]]; then
            exit 0
          fi

          HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || echo "${{ matrix.sha }}")
          echo "AI fix PR #$PR_NUM ($HEAD_REF, $HEAD_SHA) passed quality gate."

          # Post urgent notification comment to alert owner on mobile if not already posted for this commit
          MARKER="<!-- kfit-gate-notified:${HEAD_SHA} -->"
          PRIOR=$(gh api --paginate "repos/$PRIVATE_REPO/issues/$PR_NUM/comments" \
                    --jq '.[].body' 2>/dev/null | grep -cF "$MARKER" || true)
          if [ "${PRIOR:-0}" -eq 0 ]; then
            cat << 'EOF' > /tmp/urgent_comment.md
MARKER_PLACEHOLDER

@Karthik77-kk 🚨 **Urgent**: All PR quality gate checks (`flutter analyze`, `flutter test`, and coverage floor) have **PASSED** on the public runner for this AI fix PR (#PR_NUM_PLACEHOLDER).

> **Status**: ⏳ Ready for owner approval.
> - **Approve to Auto-Merge**: Submit an **Approved** review in GitHub (web or mobile). The auto-merge sweep will then safely merge it into `main`.
> - **Or Merge Directly**: Click **Merge pull request** when you are ready.
> As soon as you approve or merge, the automated release workflow will trigger.
EOF
            sed -i "s|MARKER_PLACEHOLDER|${MARKER}|g" /tmp/urgent_comment.md
            sed -i "s|PR_NUM_PLACEHOLDER|${PR_NUM}|g" /tmp/urgent_comment.md
            gh pr comment "$PR_NUM" --repo "$PRIVATE_REPO" --body-file /tmp/urgent_comment.md || true
            rm -f /tmp/urgent_comment.md
            echo "Posted urgent notification comment on PR #$PR_NUM."
          fi

          # Record verification in kfit-backups daily check report
          if [ -n "$BACKUP_TOKEN" ]; then
            CLONE_DIR="$(mktemp -d)"
            if git clone --depth 1 "https://x-access-token:${BACKUP_TOKEN}@github.com/${BACKUP_REPO}.git" "$CLONE_DIR" 2>/dev/null; then
              cd "$CLONE_DIR"
              GATE_NOTE="<!-- gate-verification-pr-$PR_NUM-$HEAD_SHA -->"
              if [ -f "daily_check/latest.md" ] && ! grep -q "$GATE_NOTE" "daily_check/latest.md"; then
                cat << 'EOF' > /tmp/gate_verify.md

GATE_NOTE_PLACEHOLDER

### 🧪 Quality Gate Verification Passed
- **Pull Request**: [#PR_NUM_PLACEHOLDER](https://github.com/PRIVATE_REPO_PLACEHOLDER/pull/PR_NUM_PLACEHOLDER)
- **Branch**: `HEAD_REF_PLACEHOLDER`
- **Checks**: ✅ `flutter analyze`, `flutter test`, and coverage floor passed (run RUN_ID_PLACEHOLDER).
- **Status**: ⏳ Awaiting owner approval from @Karthik77-kk.
EOF
                sed -i "s|GATE_NOTE_PLACEHOLDER|${GATE_NOTE}|g" /tmp/gate_verify.md
                sed -i "s|PR_NUM_PLACEHOLDER|${PR_NUM}|g" /tmp/gate_verify.md
                sed -i "s|PRIVATE_REPO_PLACEHOLDER|${PRIVATE_REPO}|g" /tmp/gate_verify.md
                sed -i "s|HEAD_REF_PLACEHOLDER|${HEAD_REF}|g" /tmp/gate_verify.md
                sed -i "s|RUN_ID_PLACEHOLDER|${{ github.run_id }}|g" /tmp/gate_verify.md

                cat /tmp/gate_verify.md >> daily_check/latest.md
                TODAY_REPORT="daily_check/reports/$(date -u +%Y-%m-%d).md"
                if [ -f "$TODAY_REPORT" ]; then
                  cat /tmp/gate_verify.md >> "$TODAY_REPORT"
                fi
                rm -f /tmp/gate_verify.md

                git config user.name "Karthik M"
                git config user.email "iammrkarthik2002@gmail.com"
                git add daily_check/
                if ! git diff --cached --quiet; then
                  git commit -m "report: PR #$PR_NUM gate checks passed"
                  git push origin HEAD 2>&1 | sed "s/${BACKUP_TOKEN}/***/g"
                  echo "Updated kfit-backups daily check with gate verification."
                fi
              fi
              cd /
              rm -rf "$CLONE_DIR"
            fi
          fi


  # The SECOND required context on kfit-app/main. Both must report before a PR
  # can merge, so porting only the Dart gate would have left every PR blocked
  # while looking like the migration had worked.
  #
  # Safe to run here: it stands up a LOCAL Supabase stack and tests against
  # that. It needs no production credentials, touches no live database, and so
  # gives a public runner nothing worth stealing.
  verify-supabase:
    name: Verify migrations
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      SUPABASE_CONTEXT: Migrations + RLS tests
    steps:
      - name: Mark the PR as running
        env:
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
        run: |
          gh api -X POST "repos/$PRIVATE_REPO/statuses/${{ matrix.sha }}" \
            -f state=pending \
            -f context="$SUPABASE_CONTEXT" \
            -f description="Running on the public runner" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out the private source
        uses: actions/checkout@v7
        with:
          repository: Karthik77-kk/kfit-app
          ref: ${{ matrix.sha }}
          token: ${{ secrets.KFIT_APP_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ matrix.base }}" "${{ matrix.sha }}")
          if echo "$FILES" | grep -qE '^supabase/'; then
            echo "supabase=true"  >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.changed.outputs.supabase == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        if: steps.changed.outputs.supabase == 'true'
        run: supabase db start

      - name: Verify migrations are idempotent and complete
        if: steps.changed.outputs.supabase == 'true'
        run: supabase db reset

      - name: Run pgTAP tests
        if: steps.changed.outputs.supabase == 'true'
        run: supabase test db

      - name: Fail if the schema drifted from the migrations
        if: steps.changed.outputs.supabase == 'true'
        run: |
          diff_output="$(supabase db diff --local || true)"
          if [ -n "$diff_output" ]; then
            echo "::error::The local schema does not match the migrations."
            echo "$diff_output"
            exit 1
          fi
          echo "✅ Schema matches the migrations."

      - name: Stop local Supabase
        if: always() && steps.changed.outputs.supabase == 'true'
        run: supabase stop --no-backup || true

      - name: Nothing to verify
        if: steps.changed.outputs.supabase == 'false'
        run: echo "No supabase/ changes — migration verification skipped."

      - name: Report the verdict back to the private PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) STATE=success; DESC="Passed on the public runner" ;;
            cancelled) STATE=error;  DESC="Cancelled" ;;
            *) STATE=failure; DESC="Failed — see the run log" ;;
          esac
          gh api -X POST "repos/$PRIVATE_REPO/statuses/${{ matrix.sha }}" \
            -f state="$STATE" \
            -f context="$SUPABASE_CONTEXT" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
