name: Daily telemetry triage

# ─────────────────────────────────────────────────────────────────────────────
# Reads the last day of app telemetry, flags errors the latest build still
# throws, asks Gemini for a diagnosis, opens an alert issue in kfit-app, and
# opens a one-file fix PR when the evidence points at one file. It also closes
# open alert issues once a newer build runs without their errors.
#
# It runs here rather than in kfit-app for the same reason every other CI job
# does: kfit-app's Actions minutes are capped, and a long Gemini fallback chain
# no longer fits in them.
#
# This repo is public, so its logs are too. Telemetry text is written by app
# clients, and the scripts it passes through only log counts and build numbers.
# Nothing here writes a step summary or an artifact; the report goes only to
# the private kfit-app issue.
#
# ## Why the patch never runs here
#
# The patch is model output shaped by telemetry anyone with an account can
# write, so it is untrusted code, and this job holds every secret. It only
# pushes the patch and opens a normal PR. The kfit-app dispatch then runs the
# PR gate on it (analyze, test, coverage floor) with no secrets in reach.
# private-auto-merge skips `ai-fix/*` branches and the [skip auto-merge]
# title: a human merges every AI fix.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 05:25 UTC = 10:55 IST. :25 avoids the :00 and :30 runner peaks.
    - cron: '25 5 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours to analyze (1-720)'
        required: false
        default: '24'
      create_issue:
        description: 'Create or update the kfit-app alert issue on a new regression'
        type: boolean
        required: false
        default: true
      enable_auto_fix:
        description: 'Open a fix PR in kfit-app when one file is to blame'
        type: boolean
        required: false
        default: true
      test_target_file:
        description: 'Target file for end-to-end verification (e.g. lib/services/food_notes_service.dart, blank for normal)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-telemetry-triage
  cancel-in-progress: false

env:
  PRIVATE_REPO: Karthik77-kk/kfit-app

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    # Each Gemini model in the diagnosis and fix chains may wait 5 minutes.
    timeout-minutes: 120
    permissions:
      contents: read
      # GitHub Models is the fallback when Gemini is unavailable.
      models: read
    steps:
      - name: Check inputs and secrets
        id: guard
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          HOURS: ${{ inputs.hours || '24' }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is not set; it is needed to read kfit-app and open its issue and PR."
            exit 1
          fi
          # HOURS goes into SQL below, so only a plain integer is allowed.
          if ! [[ "$HOURS" =~ ^[0-9]+$ ]] || [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 720 ]; then
            echo "::error::hours must be an integer from 1 to 720."
            exit 1
          fi
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Checkout kfit-app
        uses: actions/checkout@v7
        with:
          repository: Karthik77-kk/kfit-app
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
          path: app
          fetch-depth: 0
          # The fixer pushes with the token on its own command line, so nothing
          # else in this job needs it in the git config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test triage scripts
        run: node --test app/tools/telemetry/telemetry.test.js

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Fetch telemetry
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          HOURS: ${{ steps.guard.outputs.hours }}
        run: |
          mkdir -p /tmp/telemetry_data
          OUT=/tmp/telemetry_data/telemetry_events.json
          EXPORTED=false

          if [ -n "$SUPABASE_DB_URL" ]; then
            # An extra 7 days before the window is the baseline that tells a
            # new regression from a chronic error.
            FETCH_HOURS=$((HOURS + 168))
            echo "Querying the last ${FETCH_HOURS}h (${HOURS}h window + 7d baseline)..."
            psql "$SUPABASE_DB_URL" -X -q -t -A -c "
              SELECT coalesce(json_agg(t), '[]'::json)
              FROM (
                SELECT * FROM public.telemetry_events
                WHERE created_at >= NOW() - INTERVAL '${FETCH_HOURS} hours'
                ORDER BY created_at DESC
              ) t;
            " 2>/dev/null | jq . > "$OUT" 2>/dev/null || true
            if [ "$(jq 'length' "$OUT" 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "Fetched $(jq 'length' "$OUT") events from Supabase."
              EXPORTED=true
            fi
          fi

          if [ "$EXPORTED" = false ] && [ -n "$BACKUP_TOKEN" ]; then
            echo "Direct Supabase query produced no events; checking kfit-backups..."
            git clone -q --depth 1 "https://x-access-token:${BACKUP_TOKEN}@github.com/Karthik77-kk/kfit-backups.git" /tmp/backups_repo 2>/dev/null || true
            if [ -f /tmp/backups_repo/telemetry/telemetry_events.json ]; then
              DUMP_AGE_SEC=$(( $(date +%s) - $(git -C /tmp/backups_repo log -1 --format=%ct telemetry/telemetry_events.json 2>/dev/null || echo 0) ))
              DUMP_AGE_HOURS=$(( DUMP_AGE_SEC / 3600 ))
              echo "Backup export age: ${DUMP_AGE_HOURS}h."
              if [ "$DUMP_AGE_HOURS" -gt 10 ]; then
                echo "Backup export is older than 10 hours (${DUMP_AGE_HOURS}h). Triggering nightly backup workflow to refresh..."
                GH_TOKEN="${{ github.token }}" gh workflow run nightly-backup.yml 2>/dev/null || true
              fi
              cp /tmp/backups_repo/telemetry/telemetry_events.json "$OUT"
              echo "Using the backup export ($(jq 'length' "$OUT") events)."
              EXPORTED=true
            fi
            rm -rf /tmp/backups_repo
          fi

          if [ "$EXPORTED" = false ]; then
            echo "[]" > "$OUT"
            echo "::warning::No telemetry from Supabase or kfit-backups; analyzing an empty list."
          fi

      - name: Analyze
        env:
          HOURS: ${{ steps.guard.outputs.hours }}
        run: |
          node app/tools/telemetry/analyze_telemetry.js \
            --file /tmp/telemetry_data/telemetry_events.json \
            --hours "$HOURS" \
            --output-summary /tmp/telemetry_summary.md \
            --output-prompt /tmp/ai_prompt.json \
            --output-tracking /tmp/telemetry_tracking.json

      - name: AI diagnosis
        env:
          GEMINI_API_KEY_LOGS: ${{ secrets.GEMINI_API_KEY_LOGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_LOGS || secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node app/tools/telemetry/ai_triage.js \
            --prompt /tmp/ai_prompt.json \
            --summary /tmp/telemetry_summary.md \
            --action-plan /tmp/ai_action_plan.json \
            --repo-dir app

      - name: Decide on a fix
        id: plan
        if: github.event_name == 'schedule' || inputs.enable_auto_fix
        run: |
          TEST_TARGET="${{ github.event.inputs.test_target_file }}"
          if jq -e '.has_fixable_code_issue == true' /tmp/ai_action_plan.json > /dev/null 2>&1; then
            echo "fix=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$TEST_TARGET" ]; then
            echo "End-to-end test verification mode for target: $TEST_TARGET"
            node -e "
              const fs = require('fs');
              const target = process.argv[1];
              fs.writeFileSync('/tmp/ai_prompt.json', JSON.stringify({
                window_hours: 24,
                latest_version: '3.0.0+652p666',
                new_regression_count: 1,
                top_errors: [{
                  ref: 0,
                  category: 'food_notes',
                  operation: 'loadTodayNotes',
                  message: 'FormatException: Unexpected character (at character 1)',
                  code: 'CORRUPTED_JSON',
                  on_latest_version: true,
                  is_new_regression: true,
                  breadcrumbs: ['[food_notes/init] start', '[food_notes/loadTodayNotes] read_prefs'],
                  stack_preview: 'dart:convert _JsonDecoder.convert\\npackage:kfit/services/food_notes_service.dart 55:30 loadTodayNotes'
                }]
              }, null, 2));
              fs.writeFileSync('/tmp/ai_action_plan.json', JSON.stringify({
                has_fixable_code_issue: true,
                issues: [{
                  error_ref: 0,
                  signature: 'food_notes/loadTodayNotes | CORRUPTED_JSON | FormatException',
                  target_file_hint: target,
                  issue_type: 'state_error',
                  fix_strategy: 'Wrap jsonDecode with try-catch block falling back gracefully to empty list when JSON is corrupted or invalid.'
                }]
              }, null, 2));
            " "$TEST_TARGET"
            echo "fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "No fixable code issue in the plan."
          fi

      - name: Open fix PR
        if: steps.plan.outputs.fix == 'true'
        # A failed fix must not cost the day's alert issue.
        continue-on-error: true
        env:
          GEMINI_API_KEY_LOGS: ${{ secrets.GEMINI_API_KEY_LOGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_LOGS || secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          node app/tools/telemetry/ai_code_fixer.js \
            --action-plan /tmp/ai_action_plan.json \
            --prompt /tmp/ai_prompt.json \
            --summary /tmp/telemetry_summary.md \
            --repo-dir app \
            --repo "$PRIVATE_REPO"

      - name: Trigger immediate PR quality gate
        if: steps.plan.outputs.fix == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_URL=$(grep -oE 'https://github.com/[^/]+/[^/]+/pull/([0-9]+)' /tmp/telemetry_summary.md | head -n1 || true)
          if [ -n "$PR_URL" ]; then
            PR_NUM=$(basename "$PR_URL")
            echo "Triggering immediate quality gate on kfit for fix PR #$PR_NUM..."
            GH_TOKEN="${{ github.token }}" gh workflow run private-pr-gate.yml -f pr="$PR_NUM" 2>/dev/null || \
            gh workflow run private-pr-gate.yml -f pr="$PR_NUM" 2>/dev/null || true
          fi

      # Before the alert step, so a new regression is not added to a fixed issue.
      - name: Close fixed alert issues
        if: github.event_name == 'schedule' || inputs.create_issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          node app/tools/telemetry/close_fixed_issues.js \
            --tracking /tmp/telemetry_tracking.json \
            --repo "$PRIVATE_REPO"

      - name: Create or update alert issue
        if: github.event_name == 'schedule' || inputs.create_issue
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          if ! jq -e '(.new_regression_count // 0) > 0' /tmp/ai_prompt.json > /dev/null 2>&1; then
            echo "No new regression on the latest build; no issue."
            exit 0
          fi
          EXISTING=$(gh issue list --repo "$PRIVATE_REPO" --label telemetry-alert --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$PRIVATE_REPO" --body-file /tmp/telemetry_summary.md > /dev/null
            echo "Commented on the open alert issue #$EXISTING."
          else
            gh issue create --repo "$PRIVATE_REPO" \
              --title "🚨 [Telemetry Alert] New regression on the latest build ($DATE)" \
              --label "telemetry-alert,bug" \
              --body-file /tmp/telemetry_summary.md
          fi

      - name: Archive daily check report to kfit-backups
        if: always()
        env:
          BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          BACKUP_REPO: Karthik77-kk/kfit-backups
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          if [ ! -f /tmp/telemetry_summary.md ]; then
            echo "No telemetry summary to archive."
            exit 0
          fi
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "::warning::GH_BACKUP_TOKEN not set; skipping archiving to kfit-backups."
            exit 0
          fi

          REPORT_DATE="${DATE:-$(date -u +'%Y-%m-%d')}"
          CLONE_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${BACKUP_TOKEN}@github.com/${BACKUP_REPO}.git" "$CLONE_DIR" 2>&1 | sed "s/${BACKUP_TOKEN}/***/g"
          cd "$CLONE_DIR"
          mkdir -p daily_check/reports

          # Save today's report and update latest.md
          REPORT_PATH="daily_check/reports/${REPORT_DATE}.md"
          cp /tmp/telemetry_summary.md "$REPORT_PATH"
          cp /tmp/telemetry_summary.md daily_check/latest.md

          # Update daily_check/README.md with a table of recent daily check reports
          INDEX_FILE="daily_check/README.md"
          printf '%s\n' \
            "# 📋 KFit Daily Telemetry & Health Reports" \
            "" \
            "Automated daily production health checks, telemetry analytics, and AI diagnostic reviews." \
            "" \
            "- **Latest Report**: [daily_check/latest.md](latest.md)" \
            "" \
            "### Recent Reports" \
            "| Date | Report |" \
            "| :--- | :--- |" > "$INDEX_FILE"

          for f in $(ls -1 daily_check/reports/*.md 2>/dev/null | sort -r); do
            BASENAME=$(basename "$f")
            ITEM_DATE="${BASENAME%.md}"
            echo "| $ITEM_DATE | [View Report](reports/$BASENAME) |" >> "$INDEX_FILE"
          done

          # Retain most recent 90 daily reports
          ls -1 daily_check/reports/*.md 2>/dev/null | sort -r | tail -n +91 | while read -r old_file; do
            git rm -q "$old_file" 2>/dev/null || rm -f "$old_file"
          done

          git config user.name "Karthik M"
          git config user.email "iammrkarthik2002@gmail.com"
          git add daily_check/
          if git diff --cached --quiet; then
            echo "Daily check report already up-to-date in $BACKUP_REPO."
          else
            git commit -m "report: telemetry daily check ${REPORT_DATE}"
            git push origin HEAD 2>&1 | sed "s/${BACKUP_TOKEN}/***/g"
            echo "✅ Successfully archived daily check report to ${BACKUP_REPO}/daily_check."
          fi
          cd /
          rm -rf "$CLONE_DIR"
