name: Website Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-verify.yml'

jobs:
  verify:
    name: Validate Website & Release Architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release Manifest
        run: npm run test:manifest

      - name: Run Astro Typecheck & Diagnostics
        run: npm run check

      - name: Build Static Site
        run: npm run build
