name: Build JARVIS Release APK

# ─────────────────────────────────────────────────────────────────────────────
# Builds and releases JARVIS APK FROM HERE, in the public kfit repository,
# preserving private repository Actions minutes (free & unlimited runners).
# Releases and APKs are published directly to this public repository
# (Karthik77-kk/kfit) so user devices and the self-hosted in-app updater can
# download jarvis.apk publicly without requiring GitHub authentication tokens.
# Supports differential delta-updates (jarvis.patch + patch.json) generated via
# bsdiff so users download only what changed instead of the full APK.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Offset from kfit's build_apk (8-59/15) to avoid concurrent runner bottlenecks
    - cron: "12-59/15 * * * *"
  repository_dispatch:
    types: [jarvis-release, jarvis-build-apk]
  workflow_dispatch:
    inputs:
      ref:
        description: "JARVIS ref/tag/branch to build (default: main)"
        required: false
        default: "main"
      force:
        description: "Build and publish even if already built"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-jarvis-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  PRIVATE_REPO: Karthik77-kk/JARVIS
  LAST_BUILT_TAG: ci/jarvis-last-built

jobs:
  detect:
    name: Check for new JARVIS commits/tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Inspect JARVIS remote
        id: check
        env:
          GH_TOKEN: ${{ secrets.JARVIS_REPO_TOKEN || secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
          fi

          # Get SHA of target ref in JARVIS
          SHA=$(gh api "repos/${PRIVATE_REPO}/commits/${REF}" --jq '.sha' 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve ref ${REF} on ${PRIVATE_REPO}"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Target SHA: ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          # Check last-built marker tag
          LAST_BUILT_SHA=$(gh api "repos/${PRIVATE_REPO}/git/ref/tags/${LAST_BUILT_TAG}" --jq '.object.sha' 2>/dev/null || echo "")
          echo "Last built SHA: ${LAST_BUILT_SHA}"

          if [ "$FORCE" = "true" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHA" = "$LAST_BUILT_SHA" ]; then
            echo "No new commits since ${LAST_BUILT_SHA}. Skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commit detected (${SHA} != ${LAST_BUILT_SHA}). Triggering build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build JARVIS APK & Publish Release
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JARVIS Repository
        uses: actions/checkout@v4
        with:
          repository: Karthik77-kk/JARVIS
          ref: ${{ needs.detect.outputs.sha }}
          token: ${{ secrets.JARVIS_REPO_TOKEN || secrets.RELEASE_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Configure Persistent Release Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/jarvis-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=jarvis-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > apps/mobile/android/key.properties
            echo "Persistent release keystore configured successfully."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not found — build will fallback to debug signing."
          fi

      - name: Determine Dynamic Version & Tag
        id: release_info
        run: |
          # Dynamically determine build number from total commits on JARVIS main
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUM="$COMMIT_COUNT"
          VER_NAME="1.0.${BUILD_NUM}"
          TAG="jarvis-v${VER_NAME}"
          
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "Building JARVIS APK version: ${VER_NAME} (Build ${BUILD_NUM})"
          
          # Dynamically stamp pubspec.yaml with real version before build
          sed -i "s/^version: .*/version: ${VER_NAME}+${BUILD_NUM}/" apps/mobile/pubspec.yaml

      - name: Build Release APK
        run: |
          cd apps/mobile
          flutter build apk --release \
            --build-name="${{ steps.release_info.outputs.ver_name }}" \
            --build-number="${{ steps.release_info.outputs.build_num }}" \
            --android-skip-build-dependency-validation

      - name: Prepare Named Assets
        id: assets
        run: |
          cd apps/mobile/build/app/outputs/flutter-apk
          if [ -f "app-release.apk" ]; then
            cp app-release.apk jarvis.apk
          elif [ -f "app-debug.apk" ]; then
            cp app-debug.apk jarvis.apk
            cp app-debug.apk app-release.apk
          fi
          
          # Compute file size
          SIZE_BYTES=$(stat -c%s jarvis.apk)
          SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN{printf "%.1f", b/1048576}')
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "APK generated: ${SIZE_MB} MB"

      - name: Generate Release Notes
        run: |
          {
            echo "### JARVIS Autonomous Personal AI Assistant v${{ steps.release_info.outputs.ver_name }} (Build ${{ steps.release_info.outputs.build_num }})"
            echo ""
            echo "- Built automatically in public \`Karthik77-kk/kfit\` GitHub Actions"
            echo "- Amy Minimalist Interface: Apple Notes design with distraction-free layout"
            echo "- Gemini 3.6 Flash: Workhorse model with self-healing fallback"
            echo "- Local On-Device AI: LiteRT Hexagon NPU model download & cache management"
            echo "- Dynamic Version Auto-Bump: In-app updater tracks true build number"
            echo "- Delta Updates: Differential bsdiff patches (downloads only what changed)"
            echo "- LiveKit Real-Time Voice with barge-in & Dual-SIM Telecom Resolver"
            echo ""
            echo "---"
            echo "**Asset**: \`jarvis.apk\` (~${{ steps.assets.outputs.size_mb }} MB)"
          } > release_notes.md

      - name: Generate delta patch from previous release (best-effort)
        id: patch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          NEW_TAG: ${{ steps.release_info.outputs.tag }}
          NEW_BUILD: ${{ steps.release_info.outputs.build_num }}
        run: |
          set +e
          OUT=apps/mobile/build/app/outputs/flutter-apk
          APK="$OUT/jarvis.apk"
          WORK=build/patchwork
          mkdir -p "$WORK"

          # Look for previous JARVIS release in public repo
          PREV_TAG=$(gh release list --repo "${{ github.repository }}" --limit 20 | grep -E 'jarvis-v' | head -1 | awk '{print $3}')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous JARVIS release found — skipping delta patch."; exit 0
          fi
          echo "Generating delta patch: previous $PREV_TAG -> new $NEW_TAG"

          if ! gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
                 -p 'jarvis.apk' -D "$WORK" --clobber 2>/dev/null; then
            echo "Previous release $PREV_TAG has no jarvis.apk asset — skipping patch."; exit 0
          fi
          PREV="$WORK/jarvis.apk"

          sudo apt-get update -qq >/dev/null 2>&1
          if ! sudo apt-get install -y -qq bsdiff >/dev/null 2>&1; then
            echo "bsdiff unavailable — skipping patch."; exit 0
          fi

          if ! timeout 600 bsdiff "$PREV" "$APK" "$WORK/jarvis.patch"; then
            echo "bsdiff failed or timed out — skipping patch."; rm -f "$WORK/jarvis.patch"; exit 0
          fi

          FULL_BYTES=$(stat -c%s "$APK")
          PATCH_BYTES=$(stat -c%s "$WORK/jarvis.patch")

          if [ "$PATCH_BYTES" -ge $(( FULL_BYTES * 60 / 100 )) ]; then
            echo "Patch ${PATCH_BYTES}B >= 60% of full ${FULL_BYTES}B — skipping."; exit 0
          fi

          FROM_BUILD=$(printf '%s' "$PREV_TAG" | awk -F. '{print $NF}')
          if ! printf '%s' "$FROM_BUILD" | grep -qE '^[0-9]+$'; then
            FROM_BUILD="1"
          fi

          FROM_SHA=$(sha256sum "$PREV" | cut -d' ' -f1)
          TO_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          PATCH_SHA=$(sha256sum "$WORK/jarvis.patch" | cut -d' ' -f1)

          cp "$WORK/jarvis.patch" "$OUT/jarvis.patch"

          jq -n \
            --argjson fromBuild "$FROM_BUILD" \
            --arg     fromTag   "$PREV_TAG" \
            --arg     fromSha256 "$FROM_SHA" \
            --argjson toBuild   "$NEW_BUILD" \
            --arg     toTag     "$NEW_TAG" \
            --arg     toSha256  "$TO_SHA" \
            --argjson patchSize "$PATCH_BYTES" \
            --arg     patchSha256 "$PATCH_SHA" \
            '{fromBuild:$fromBuild, fromTag:$fromTag, fromSha256:$fromSha256, toBuild:$toBuild, toTag:$toTag, toSha256:$toSha256, patchSize:$patchSize, patchSha256:$patchSha256}' \
            > "$OUT/patch.json"

          echo "patch_ready=true" >> "$GITHUB_OUTPUT"
          PMB=$(awk -v b="$PATCH_BYTES" 'BEGIN{printf "%.1f", b/1048576}')
          FMB=$(awk -v b="$FULL_BYTES"  'BEGIN{printf "%.0f", b/1048576}')
          echo "Delta patch generated: ${PMB} MB (vs ${FMB} MB full APK)"

      - name: Publish or Attach to Public kfit GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          APK_PATH="apps/mobile/build/app/outputs/flutter-apk/jarvis.apk"
          OUT="apps/mobile/build/app/outputs/flutter-apk"
          
          ASSETS=("$APK_PATH")
          if [ -f "$OUT/jarvis.patch" ] && [ -f "$OUT/patch.json" ]; then
            ASSETS+=("$OUT/jarvis.patch" "$OUT/patch.json")
            echo "Attaching delta patch assets: jarvis.patch + patch.json"
          fi
          
          echo "Publishing ${TAG} with ${#ASSETS[@]} assets to ${{ github.repository }}..."
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "JARVIS v${{ steps.release_info.outputs.ver_name }}" \
            --notes-file release_notes.md \
            --latest \
            || gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-public
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Update Last Built Marker Tag on JARVIS
        if: success()
        env:
          GH_TOKEN: ${{ secrets.JARVIS_REPO_TOKEN || secrets.RELEASE_PAT || github.token }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api -X PATCH "repos/${PRIVATE_REPO}/git/refs/tags/${LAST_BUILT_TAG}" \
               -f sha="$SHA" -F force=true >/dev/null 2>&1; then
            echo "Marker tag ${LAST_BUILT_TAG} moved to ${SHA}"
          elif gh api -X POST "repos/${PRIVATE_REPO}/git/refs" \
                 -f ref="refs/tags/${LAST_BUILT_TAG}" -f sha="$SHA" >/dev/null 2>&1; then
            echo "Marker tag ${LAST_BUILT_TAG} created at ${SHA}"
          else
            echo "::warning::Could not update marker ${LAST_BUILT_TAG} on ${PRIVATE_REPO}"
          fi
